version: '3.9'
services:
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8000:8000"

  streamlit-ui:
    build:
      context: .
    ports:
      - "8501:8501"

networks:
  bridge:

volumes:
  chroma-data: