version: '3.9'
services:
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8000:8000"
    networks:
      - tulens-network

  streamlit-ui:
    build:
      context: .
    ports:
      - "8501:8501"
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      - chromadb
    networks:
      - tulens-network

networks:
  tulens-network:
    driver: bridge

volumes:
  chroma-data: